# Render deploy config for the PPD Athlete Portal (Next.js).
# Runs as a long-lived Node server (`next start`), so FFmpeg (bundled via the
# ffmpeg-static npm package) works without any extra system packages.
services:
  - type: web
    name: ppd-athlete-portal
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Set this in the Render dashboard (mark it secret) — do not commit it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: override the model. Defaults to claude-opus-5 in code.
      - key: ANTHROPIC_MODEL
        sync: false
